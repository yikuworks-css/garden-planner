<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-title" content="Garden Planner">
<meta name="theme-color" content="#e2eee8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Garden Planner</title>
<style>
  :root{
    --panel: rgba(255,252,245,.88);
    --card: rgba(255,255,255,.75);
    --ink:#2d3a2e; --muted:#6b756a;
    --accent:#3d8b4f; --accent-soft:#e2f0e3;
    --line: rgba(60,55,40,.10);
    --danger:#c8473d;
    --trayH: 150px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden; touch-action:none;
    background:linear-gradient(#b9d9f0 0%, #e2eee8 52%, #eee9de 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; color:var(--ink);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  button{font-family:inherit; color:inherit; cursor:pointer}
  #c{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none}
  .panel{background:var(--panel); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid var(--line); box-shadow:0 6px 24px rgba(40,50,30,.12); border-radius:18px}
  .brand{position:fixed; top:max(14px, env(safe-area-inset-top)); left:16px; padding:9px 14px;
    font-weight:700; font-size:15px; display:flex; gap:8px; align-items:center}
  .brand svg{width:18px; height:18px; color:var(--accent)}
  .tools{position:fixed; left:16px; top:calc(50% - var(--trayH)/2 + 26px); transform:translateY(-50%);   /* centred between the name badge and the plant row */
    display:flex; flex-direction:column; gap:4px; padding:7px}
  .tool{width:60px; height:58px; border:0; border-radius:13px; background:transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    font-size:11px; font-weight:650; line-height:1; transition:background .15s, color .15s}
  .tool svg{width:24px; height:24px}
  .tool:hover{background:rgba(61,139,79,.08)}
  .tool.on{background:var(--accent); color:#fff}
  .top{position:fixed; top:max(14px, env(safe-area-inset-top)); right:16px; display:flex; gap:2px; padding:5px}
  .btn{height:38px; padding:0 12px; border:0; border-radius:12px; background:transparent;
    font-size:13px; font-weight:650; display:flex; align-items:center; gap:6px}
  .btn svg{width:18px; height:18px}
  .btn:hover:not(:disabled){background:rgba(61,139,79,.08)}
  .btn:disabled{opacity:.35; cursor:default}
  .tray{position:fixed; left:12px; right:12px; bottom:max(12px, env(safe-area-inset-bottom)); padding:8px 6px 10px}
  .tabs{display:flex; gap:4px; overflow-x:auto; padding:0 4px 8px; touch-action:pan-x; scrollbar-width:none}
  .tabs::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
  .tab{flex:none; border:0; background:transparent; padding:7px 13px; border-radius:999px;
    font-size:13px; font-weight:650; color:var(--muted)}
  .tab.on{background:var(--accent-soft); color:var(--accent)}
  .row{display:flex; gap:8px; overflow-x:auto; touch-action:pan-x; padding:0 4px; scrollbar-width:none}
  .card{flex:none; width:88px; border:0; background:var(--card); border-radius:14px; padding:6px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:3px; touch-action:pan-x; cursor:grab;
    font-size:11.5px; font-weight:650; line-height:1.15; text-align:center; box-shadow:inset 0 0 0 1px var(--line);
    transition:transform .12s}
  .card:hover{transform:translateY(-2px)}
  .card img{width:64px; height:64px; pointer-events:none}
  .remove-zone{position:absolute; inset:0; border-radius:18px; display:none; align-items:center; justify-content:center;
    gap:10px; background:rgba(200,71,61,.93); color:#fff; font-weight:700; font-size:16px}
  .remove-zone svg{width:22px; height:22px}
  .tray.remove .remove-zone{display:flex}
  .hint{position:fixed; left:50%; transform:translateX(-50%); top:calc(max(14px, env(safe-area-inset-top)) + 58px);
    padding:9px 16px; font-size:14px; line-height:1.35; max-width:min(560px, calc(100% - 32px)); text-align:center;
    border-radius:999px; transition:opacity .25s; pointer-events:none}
  .hint.warn{background:rgba(255,240,232,.95); color:#8a3b2a}
  .selbar{position:fixed; display:none; gap:2px; padding:4px; transform:translate(-50%,-100%); border-radius:14px}
  .selbar .btn{height:36px; padding:0 10px}
  .selbar .btn.del{color:var(--danger)}
  .ring-chip{position:fixed; width:76px; height:76px; pointer-events:none; transform:translate(-50%,-60%) scale(1.15);
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.25)); display:none; z-index:20}
  .modal{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(30,40,30,.25); z-index:30}
  .modal[hidden]{display:none}
  .modal-card{padding:22px; width:min(340px, calc(100% - 32px)); display:flex; flex-direction:column; gap:8px}
  .modal-card h3{margin:0 0 2px; font-size:18px}
  .modal-card p{margin:0 0 8px; color:var(--muted); font-size:14px}
  .mbtn{height:44px; border:0; border-radius:12px; background:var(--card); font-size:15px; font-weight:650;
    box-shadow:inset 0 0 0 1px var(--line)}
  .mbtn.primary{background:var(--accent); color:#fff; box-shadow:none}
  .mbtn.ghost{background:transparent; box-shadow:none; color:var(--muted)}
  #loading{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--muted); z-index:40}
  .pop{position:fixed; top:calc(max(14px, env(safe-area-inset-top)) + 58px); right:16px; width:290px; padding:10px;
    display:none; flex-direction:column; gap:6px; z-index:25}
  .pop.open{display:flex}
  .pop-note{margin:2px 4px 6px; font-size:13px; color:var(--muted); line-height:1.4}
  .pbtn{display:flex; align-items:center; gap:10px; width:100%; border:0; background:var(--card); border-radius:12px;
    padding:10px 12px; text-align:left; font-size:14px; font-weight:650; box-shadow:inset 0 0 0 1px var(--line)}
  .pbtn svg{width:20px; height:20px; flex:none; color:var(--accent)}
  .pbtn small{display:block; font-weight:500; color:var(--muted); font-size:12px; margin-top:2px}
  .pbtn:hover{background:#fff}
  .switch-row{display:flex; align-items:center; justify-content:space-between; padding:6px 6px; font-size:14px; font-weight:650}
  .switch{appearance:none; -webkit-appearance:none; width:44px; height:26px; border-radius:99px; background:#cfd4cc;
    position:relative; cursor:pointer; transition:background .15s; margin:0; flex:none}
  .switch::after{content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .15s}
  .switch:checked{background:var(--accent)} .switch:checked::after{transform:translateX(18px)}
  .seg-label{padding:6px 6px 2px; font-size:12px; color:var(--muted); font-weight:650}
  .seg{display:flex; gap:4px; background:rgba(0,0,0,.05); padding:3px; border-radius:12px}
  .seg button{flex:1; border:0; background:transparent; height:34px; border-radius:9px; font-size:13px; font-weight:650; color:var(--muted)}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .sound-test{position:fixed; right:16px; top:140px; width:236px; padding:12px; display:grid; grid-template-columns:1fr 1fr; gap:6px;
    max-height:calc(100% - var(--trayH) - 160px); overflow:auto; z-index:15}
  .sound-test b,.sound-test p{grid-column:1/-1; margin:0 2px} .sound-test p{font-size:12px; color:var(--muted); margin-bottom:4px}
  .sound-test .pbtn{padding:9px 10px; font-size:13px; justify-content:center}
  @media (max-width:640px){ .btn span{display:none} .brand span{display:none} }
  @media (max-height:620px){
    .tool{width:48px; height:44px} .tool span{display:none}
    .card{width:76px} .card img{width:52px; height:52px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">Loading your garden…</div>

<div class="brand panel">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>
  <span>Garden Planner</span>
</div>

<div class="tools panel" id="tools"></div>

<div class="top panel">
  <button class="btn" id="undoBtn" title="Undo (Ctrl/Cmd+Z)" disabled></button>
  <button class="btn" id="viewBtn" title="Switch view"></button>
  <button class="btn" id="saveBtn" title="Save or share your design"></button>
  <button class="btn" id="soundBtn" title="Sound"></button>
  <button class="btn" id="resetBtn" title="Start over"></button>
</div>

<div class="pop panel" id="savePop">
  <p class="pop-note">Your garden saves itself on this device, so it is still here next time you open the page.</p>
  <button class="pbtn" id="picBtn"></button>
  <button class="pbtn" id="linkBtn"></button>
</div>

<div class="pop panel" id="soundPop">
  <label class="switch-row"><span>Sound effects</span><input type="checkbox" class="switch" id="sfxToggle"></label>
  <div class="seg-label">Background</div>
  <div class="seg" id="bgSeg">
    <button data-bg="off">Off</button><button data-bg="garden">Garden</button><button data-bg="music">Music</button>
  </div>
</div>

<div class="hint panel" id="hint"></div>

<div class="selbar panel" id="selbar">
  <button class="btn" id="turnBtn" title="Turn (R)"></button>
  <button class="btn" id="bigBtn" title="Bigger (+)"></button>
  <button class="btn" id="smallBtn" title="Smaller (-)"></button>
  <button class="btn" id="potBtn"></button>
  <button class="btn del" id="delBtn" title="Remove (Delete)"></button>
</div>

<div class="tray panel" id="tray">
  <div class="tabs" id="tabs"></div>
  <div class="row" id="row"></div>
  <div class="remove-zone" id="removeZone"></div>
</div>

<img class="ring-chip" id="chip" alt="">

<div class="modal" id="modal" hidden>
  <div class="panel modal-card">
    <h3>Start over?</h3>
    <p>You can still press Undo afterwards.</p>
    <button class="mbtn primary" data-reset="now">My garden as it is now</button>
    <button class="mbtn" data-reset="empty">Empty garden (just soil)</button>
    <button class="mbtn ghost" data-reset="cancel">Cancel</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= icons ================= */
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  move: svg('<path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/>'),
  shovel: svg('<path d="M2 22v-5l5-5 5 5-5 5z"/><path d="M9.5 14.5 16 8"/><path d="m17 2 5 5-.5.5a3.5 3.5 0 0 1-5 0 3.5 3.5 0 0 1 0-5z"/>'),
  drop: svg('<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>'),
  sprout: svg('<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>'),
  rake: svg('<path d="M12 2v12M5 14h14M6 14v6M9 14v6M12 14v6M15 14v6M18 14v6"/>'),
  sand: svg('<path d="M2 20h20"/><path d="M4 20c1.5-4.5 4.5-7 8-7s6.5 2.5 8 7"/><path d="M9 17.5h.01M12.5 15.8h.01M15.5 18h.01"/>'),
  pot: svg('<path d="M4 7h16v3H4z"/><path d="M6 10l1.4 10h9.2L18 10"/>'),
  ground: svg('<path d="M2 20h20"/><path d="M5 20c1.2-2.4 3.8-3.5 7-3.5s5.8 1.1 7 3.5"/><path d="M12 16.5V9"/><path d="M12 12c-2.6 0-4-1.6-4-4 2.6 0 4 1.6 4 4zM12 10.5c0-2.4 1.4-4 4-4 0 2.4-1.4 4-4 4z"/>'),
  bigger: svg('<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>'),
  smaller: svg('<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>'),
  undo: svg('<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'),
  grid: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>'),
  cube: svg('<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'),
  restart: svg('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'),
  turn: svg('<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>'),
  trash: svg('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
  save: svg('<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>'),
  camera: svg('<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>'),
  link: svg('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'),
  sound: svg('<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>'),
  mute: svg('<path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/>'),
};

/* ================= sound: everything is made in code (original, no sound files) ================= */
const audio = (() => {
  const S = { sfx: true, bg: 'music' };   // the client hears the soft music by default
  try { Object.assign(S, JSON.parse(localStorage.getItem('garden-planner-sound') || '{}')); } catch (e) {}
  const testMute = new URLSearchParams(location.search).has('mute');   // for automated checks: runs everything silently
  let ctx = null, sfxBus, bgBus, echoIn, noiseBuf, bgNodes = null, bgTimer = 0;
  const last = {}, rnd = (a, b) => a + Math.random() * (b - a);

  function init(){
    if (ctx){ if (ctx.state === 'suspended' && !document.hidden) ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
    const master = ctx.createGain(); master.gain.value = testMute ? 0 : .9; master.connect(comp);
    sfxBus = ctx.createGain(); sfxBus.connect(master);
    bgBus = ctx.createGain(); bgBus.gain.value = 0; bgBus.connect(master);
    // a soft echo, so music and birds sound like they are outdoors
    const delay = ctx.createDelay(1), fb = ctx.createGain(), damp = ctx.createBiquadFilter();
    delay.delayTime.value = .33; fb.gain.value = .3; damp.type = 'lowpass'; damp.frequency.value = 2200;
    echoIn = ctx.createGain(); echoIn.gain.value = .45;
    echoIn.connect(delay); delay.connect(damp); damp.connect(fb); fb.connect(delay); damp.connect(bgBus);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (ctx.state === 'suspended') ctx.resume();
    applyBg();
  }
  const now = () => ctx.currentTime;
  function env(g, t, a, peak, dec){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dec); }
  function tone({ type = 'sine', f0, f1, t = now(), a = .005, dec = .15, vol = .2, out = sfxBus, pan = 0, echo = false }){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + a + dec * .7);
    env(g, t, a, vol, dec); o.connect(g);
    let node = g;
    if (pan && ctx.createStereoPanner){ const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
    node.connect(out); if (echo) node.connect(echoIn);
    o.start(t); o.stop(t + a + dec + .05);
  }
  function noise({ t = now(), type = 'bandpass', f = 1000, f1, q = 1, a = .005, dec = .15, vol = .2, out = sfxBus }){
    const s = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; s.loop = true;
    flt.type = type; flt.frequency.setValueAtTime(f, t); if (f1) flt.frequency.exponentialRampToValueAtTime(f1, t + a + dec); flt.Q.value = q;
    env(g, t, a, vol, dec);
    s.connect(flt); flt.connect(g); g.connect(out);
    s.start(t, Math.random() * 1.5); s.stop(t + a + dec + .05);
  }
  const SFX = {
    tick(){ tone({ type: 'triangle', f0: 1400, dec: .03, vol: .06 }); },
    pick(){ tone({ f0: 380, f1: 720, dec: .09, vol: .16 }); },
    drop(){ const t = now(); tone({ f0: rnd(150, 180), f1: 70, dec: .16, vol: .45, t }); noise({ t, type: 'lowpass', f: 900, dec: .08, vol: .12 }); },
    place(){ SFX.drop(); const t = now() + .08; tone({ type: 'triangle', f0: 1318, dec: .18, vol: .05, t }); tone({ type: 'triangle', f0: 1760, dec: .25, vol: .045, t: t + .07 }); },
    nope(){ const t = now(); tone({ type: 'triangle', f0: 330, dec: .09, vol: .1, t }); tone({ type: 'triangle', f0: 247, dec: .14, vol: .1, t: t + .1 }); },
    remove(){ noise({ f: 2200, f1: 350, q: 1.2, a: .02, dec: .25, vol: .22 }); },
    dig(){ const t = now(); for (let i = 0; i < 3; i++) noise({ t: t + i * .035, f: rnd(700, 1300), q: 1.5, dec: .05, vol: .3 }); tone({ f0: 120, f1: 60, dec: .12, vol: .25, t }); },
    water(){ const t = now(); for (let i = 0; i < 3; i++) tone({ f0: rnd(280, 420), f1: rnd(800, 1300), a: .004, dec: .07, vol: .09, t: t + i * rnd(.04, .08) }); noise({ t, type: 'highpass', f: 2500, a: .01, dec: .22, vol: .07 }); },
    splash(){ const t = now(); noise({ t, f: 1800, f1: 600, q: .8, a: .01, dec: .2, vol: .2 }); tone({ f0: 500, f1: 1400, dec: .06, vol: .07, t: t + .03 }); },
    grass(){ noise({ type: 'highpass', f: 3500, a: .03, dec: .16, vol: .09 }); },
    rake(){ noise({ f: 1400, f1: 2000, q: 2, a: .01, dec: .13, vol: .16 }); },
    sand(){ const t = now(); noise({ t, f: 2600, f1: 1500, q: .7, a: .03, dec: .2, vol: .1 }); for (let i = 0; i < 3; i++) noise({ t: t + .02 + i * rnd(.03, .05), type: 'highpass', f: 4500, dec: .02, vol: .05 }); },
    grow(){ const t = now(); [523, 659, 784].forEach((f, i) => tone({ type: 'triangle', f0: f, dec: .1, vol: .05, t: t + i * .045 })); },
    shrink(){ const t = now(); [784, 659, 523].forEach((f, i) => tone({ type: 'triangle', f0: f, dec: .1, vol: .05, t: t + i * .045 })); },
    pot(){ const t = now(); tone({ type: 'triangle', f0: 620, f1: 560, dec: .12, vol: .12, t }); tone({ f0: 1250, dec: .07, vol: .04, t }); tone({ f0: 160, f1: 90, dec: .1, vol: .2, t }); },

const cellCenter = (c, r) => [X0 + (c + .5) * CELL, Z0 + (r + .5) * CELL];

const UP = new THREE.Vector3(0, 1, 0);

/* ================= little helpers ================= */
function rngFrom(str){
  let h = 1779033703 ^ str.length;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const G = {

const tmpMat = new Map();

// Bake a model's parts into one mesh with vertex colours (cheap to draw on an iPad).
function bake(root, R){
  root.updateMatrixWorld(true);
  const geos = [], col = new THREE.Color();

    if (!o.isMesh) return;
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(o.matrixWorld);
    for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
    if (!g.attributes.normal) g.computeVertexNormals();
    col.copy(o.material.color).multiplyScalar(.9 + R() * .2);
    const n = g.attributes.position.count, arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++){ arr[i * 3] = col.r; arr[i * 3 + 1] = col.g; arr[i * 3 + 2] = col.b; }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    geos.push(g);
  });
  const merged = mergeGeometries(geos, false);
  geos.forEach(g => g.dispose());
  merged.computeBoundingBox(); merged.computeBoundingSphere();
  return merged;
}

}

function spawn(mat, x, y, z, vx, vy, vz, s, life, floor){

function dirtBurst(x, y, z){

/* ================= items ================= */
const items = [], itemMeshes = [];
let selected = null;
const onSoil = (x, z) => !!soilCellAt(...cellAt(x, z));
// opt.gr: planted straight in the soil (plants on soil only), opt.s: size (1 = as built)
function addItem(type, x, z, rot = 0, drop = true, opt = {}){
  const plant = isPlant(type), gr = plant && !!opt.gr && onSoil(x, z);
  const s = clamp(+opt.s || defScale(type), SIZES[0], SIZES[SIZES.length - 1]);
  const geo = getGeo(type, gr), g = new THREE.Group(), mesh = new THREE.Mesh(geo, vcMat);
  mesh.castShadow = mesh.receiveShadow = true; mesh.scale.setScalar(s); g.add(mesh);
  g.rotation.order = 'YXZ';
  const it = { type, x, z, rot, g, mesh, plant, gr, s, r: BY_ID[type].r * s, h: geo.boundingBox.max.y * s, lift: false, anim: drop ? { kind: 'drop', t: 0 } : null };
  mesh.userData.item = it;
  g.position.set(x, surfaceY(x, z), z); g.rotation.y = rot;
  scene.add(g); items.push(it); itemMeshes.push(mesh);
  return it;
}
function removeItem(it){
  scene.remove(it.g);
  items.splice(items.indexOf(it), 1); itemMeshes.splice(itemMeshes.indexOf(it.mesh), 1);
  if (selected === it) select(null);
}
function clearItems(){ while (items.length) removeItem(items[0]); }
// pot <-> straight in the soil (plants only); returns true if it changed
function setGround(it, on){
  on = it.plant && !!on;
  if (it.gr === on) return false;
  it.gr = on; it.mesh.geometry = getGeo(it.type, on); it.h = it.mesh.geometry.boundingBox.max.y * it.s;
  return true;
}
function setSize(it, s){ it.s = s; it.r = BY_ID[it.type].r * s; it.h = it.mesh.geometry.boundingBox.max.y * s; }
function canPlace(x, z, r, self){
  const [c, rw] = cellAt(x, z);
  if (!inFloor(c, rw)) return false;
  if (x < X0 + .08 || x > X0 + COLS * CELL - .08 || z < Z0 + .08 || z > Z0 + ROWS * CELL - .08) return false;
  const cell = soilCellAt(c, rw);
  if (cell && cell.wa) return false;
  for (const o of items){ if (o === self || o.ghost) continue; if (Math.hypot(o.x - x, o.z - z) < (o.r + r) * .6) return false; }
  return true;
}
const itemsOnCell = cell => items.filter(it => !it.ghost && (([c, r]) => c === cell.c && r === cell.r)(cellAt(it.x, it.z)));
function select(it){
  selected = it;
  selRing.visible = !!it;
  if (!it) selbar.style.display = 'none'; else updateSelbar();
}

/* ================= save, undo ================= */
// v2: items [type, x, z, turn, in soil, size], soil squares [dug, grass, water, sand]
const KEY = 'garden-planner-v2', OLD_KEY = 'garden-planner-v1';
const undoStack = [];
function serialize(){
  return JSON.stringify({ v: 2,
    items: items.filter(i => !i.ghost).map(i => [i.type, +i.x.toFixed(3), +i.z.toFixed(3), +i.rot.toFixed(3), i.gr ? 1 : 0, i.s]),
    cells: cells.map(c => [c.d, c.g, c.wa, c.sa]) });
}
// A phase 1 design (v1): squares [dug, grass, wet, water] in the old wider bed, every plant in a pot at size 1.
// Keep the squares that are still soil; plants keep their pots and get the new bigger plant size.
function upgrade(s){
  if (s.v === 2) return s;
  const out = { v: 2, items: [], cells: cells.map(() => [0, 0, 0, 0]) };
  (s.items || []).forEach(([t, x, z, r]) => { if (BY_ID[t]) out.items.push([t, x, z, r || 0, 0, defScale(t)]); });
  (s.cells || []).slice(0, OLD_COUNT).forEach((a, i) => {
    const c = i % OLD_W, r = OLD_R0 + Math.floor(i / OLD_W), ni = soilIndex[r * COLS + c];
    if (ni >= 0) out.cells[ni] = [a[0] | 0, a[1] | 0, a[3] | 0, 0];
  });
  return out;
}
function restore(json){
  const s = upgrade(JSON.parse(json));
  clearItems();
  cells.forEach((c, i) => { const a = s.cells[i] || []; Object.assign(c, { d: a[0] | 0, g: a[1] | 0, w: 0, wa: a[2] | 0, sa: a[3] | 0 }); });
  refreshCells();
  s.items.forEach(([t, x, z, r, gr, sc]) => { if (BY_ID[t]) addItem(t, x, z, r, false, { gr, s: sc }); });
  select(null);
}
function pushUndo(before){ undoStack.push(before ?? serialize()); if (undoStack.length > 60) undoStack.shift(); undoBtn.disabled = false; }
function undo(){ if (!undoStack.length) return; restore(undoStack.pop()); undoBtn.disabled = !undoStack.length; save(); audio.play('undo'); flash('Undone'); }
function save(){ clearTimeout(save.t); save.t = setTimeout(() => { try { localStorage.setItem(KEY, serialize()); } catch (e) {} }, 300); }
function loadDefault(empty){
  clearItems();
  cells.forEach(c => Object.assign(c, { d: 0, g: 0, w: 0, wa: 0, sa: 0 }));
  refreshCells();
  if (!empty) DEFAULT_ITEMS.forEach(([t, x, z]) => addItem(t, x, z, 0, false, { gr: true }));   // plants on the soil grow in it, the rest keep their pots
  select(null);
}

/* ================= camera control ================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floorPlane = new THREE.Plane(UP, 0);
function setRay(e){ const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, camera); }
function floorPoint(e){ setRay(e); const v = new THREE.Vector3(); return ray.ray.intersectPlane(floorPlane, v) ? v : null; }
function pickItem(e){ setRay(e); const h = ray.intersectObjects(itemMeshes, false).find(h => !h.object.userData.item.ghost); return h ? h.object.userData.item : null; }
function pickCell(e){
  setRay(e);
  const h = ray.intersectObject(soilMesh, false)[0];
  if (!h) return -1;
  // A click into a hole often lands on the hole's side wall, which belongs to the next square.
  // Step from the wall into the hole, so the tool works on the square you meant.
  if (h.face && Math.abs(h.face.normal.y) < .5){
    const p = h.point.clone().addScaledVector(h.face.normal, CELL * .5), [c, r] = cellAt(p.x, p.z);
    const i = inFloor(c, r) ? soilIndex[r * COLS + c] : -1;
    if (i >= 0) return i;
  }
  return h.instanceId;
}
const overTray = e => { const r = tray.getBoundingClientRect(); return e.clientY >= r.top - 4 && e.clientX >= r.left && e.clientX <= r.right; };

// My pointer handler is registered BEFORE OrbitControls so it can switch the camera off while dragging.
canvas.addEventListener('pointerdown', onCanvasDown);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .09;
controls.minDistance = 2.2; controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * .47;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

function viewPose(kind){
  const a = innerWidth / innerHeight, k = a < .8 ? 1.5 : a < 1.15 ? 1.18 : 1;
  if (kind === 'top') return { p: new THREE.Vector3(0, 10.5 * k, -.34), t: new THREE.Vector3(0, 0, -.4) };   // camera a hair in front, so the front of the garden is at the bottom
  return { p: new THREE.Vector3(-1.7 * k, 4.9 * k, 7.1 * k), t: new THREE.Vector3(0, 0, -.2) };
}
let camTween = null;
function goView(kind){ const v = viewPose(kind); camTween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: v.p, t1: v.t, k: 0 }; }
const isTop = () => controls.getPolarAngle() < .35;
let lastTop = null;
function updateViewBtn(){
  const t = isTop(); if (t === lastTop) return; lastTop = t;
  viewBtn.innerHTML = t ? ICON.cube + '<span>3D view</span>' : ICON.grid + '<span>Top view</span>';
}

/* ================= pointer gestures ================= */
let gesture = null;   // what the finger on the garden is doing
let newDrag = null;   // dragging a new item out of the tray

function onCanvasDown(e){
  if (newDrag && newDrag.started){ controls.enabled = false; return; }
  if (gesture){ if (gesture.kind !== 'look') controls.enabled = false; return; }  // a 2nd finger while dragging: ignore
  if (e.button > 0){ gesture = { kind: 'look', pointerId: e.pointerId, sx: e.clientX, sy: e.clientY }; return; }
  hover.visible = false;
  if (tool === 'move'){
    const it = pickItem(e);
    if (it){ startMove(e, it); return; }
  } else {
    if (tool === 'water'){
      const it = pickItem(e);
      if (it){ controls.enabled = false; waterPlant(it); gesture = { kind: 'tap', pointerId: e.pointerId }; return; }
    }
    const ci = pickCell(e);
    if (ci >= 0){ startStroke(e, ci); return; }
    const fp = floorPoint(e);
    if (fp && inFloor(...cellAt(fp.x, fp.z))) flash(tool === 'water' ? 'Water the soil or a plant.' : 'This tool works on the soil, not the tiles.', true);
  }
  gesture = { kind: 'look', pointerId: e.pointerId, sx: e.clientX, sy: e.clientY };
}

function startMove(e, it){
  controls.enabled = false;
  select(it);
  audio.play('pick');
  const fp = floorPoint(e) || new THREE.Vector3(it.x, 0, it.z);
  gesture = { kind: 'move', pointerId: e.pointerId, it, sx: e.clientX, sy: e.clientY, ox: it.x - fp.x, oz: it.z - fp.z, x0: it.x, z0: it.z, gr0: it.gr, moved: false, valid: true, before: serialize() };
}
function startStroke(e, ci){
  controls.enabled = false;
  gesture = { kind: 'stroke', pointerId: e.pointerId, done: new Set(), before: serialize(), changed: false, lx: e.clientX, ly: e.clientY };
  applyTool(ci, gesture);
}

function applyTool(ci, g){
  if (g.done.has(ci)) return;
  g.done.add(ci);
  const c = cells[ci], [x, z] = cellCenter(c.c, c.r), top = cellTop(c);
  showHover(ci, true);
  let changed = false;
  if (tool === 'dig'){
    const hadWater = c.wa;
    if (c.wa){ c.wa = 0; changed = true; }            // scoop the water out, the hole stays
    else if (c.g){ c.g = 0; changed = true; }
    else if (c.sa){ c.sa = 0; changed = true; }         // sand comes off first, like grass
    else if (c.d < 2){ c.d++; changed = true; }
    else flash('That hole is as deep as it goes.');
    if (changed && hadWater){ splash(x, -.04, z); audio.play('splash'); }
    else if (changed){ dirtBurst(x, top, z); audio.play('dig'); }
  } else if (tool === 'water'){
    // like a water block: any soil square becomes blue water (flat soil gets a shallow hole first)
    const on = itemsOnCell(c);
    rain(x, top, z); audio.play('water');
    if (on.length) on.forEach(it => it.anim = { kind: 'water', t: 0 });
    else if (!c.wa){ Object.assign(c, { d: Math.max(1, c.d), g: 0, sa: 0, w: 0, wa: 1 }); changed = true; }
  } else if (tool === 'grass'){
    if (!c.g || c.d || c.wa){ Object.assign(c, { g: 1, sa: 0, d: 0, w: 0, wa: 0 }); changed = true; audio.play('grass'); }
  } else if (tool === 'sand'){
    if (!c.sa || c.d || c.wa){ Object.assign(c, { sa: 1, g: 0, d: 0, w: 0, wa: 0 }); changed = true; audio.play('sand'); }
  } else if (tool === 'rake'){
    if (c.g || c.sa || c.d || c.w || c.wa){ Object.assign(c, { g: 0, sa: 0, d: 0, w: 0, wa: 0 }); changed = true; dirtBurst(x, top, z); audio.play('rake'); }
  }
  if (changed){ g.changed = true; refreshCells(); }
}
function waterPlant(it){
  rain(it.g.position.x, it.g.position.y + it.h * .6, it.g.position.z, .3); audio.play('water');
  it.anim = { kind: 'water', t: 0 };
}
function showHover(ci, active){
  if (ci < 0){ hover.visible = false; return; }
  const c = cells[ci], [x, z] = cellCenter(c.c, c.r);
  hover.position.set(x, cellTop(c) + .004, z);
  hover.material.opacity = active ? .55 : .35;
  hover.visible = true;
}

window.addEventListener('pointermove', e => {
  if (gesture && e.pointerId === gesture.pointerId){
    const g = gesture;
    if (g.kind === 'move'){
      if (!g.moved && Math.hypot(e.clientX - g.sx, e.clientY - g.sy) < 5) return;
      g.moved = true; g.it.lift = true; selbar.style.display = 'none';
      const over = overTray(e);
      tray.classList.toggle('remove', over);
      if (over){ dragRing.visible = false; return; }
      const fp = floorPoint(e);
      if (fp){
        g.it.x = snap(fp.x + g.ox); g.it.z = snap(fp.z + g.oz);
        if (g.gr0) setGround(g.it, onSoil(g.it.x, g.it.z));   // a plant from the soil gets a pot on the tiles
        g.valid = canPlace(g.it.x, g.it.z, g.it.r, g.it);
        showRing(g.it, g.valid);
      }
    } else if (g.kind === 'stroke'){
      // fill the gap since the last move, so a fast swipe doesn't skip cells
      const steps = Math.max(1, Math.ceil(Math.hypot(e.clientX - g.lx, e.clientY - g.ly) / 6));
      for (let s = 1; s <= steps; s++){
        const ci = pickCell({ clientX: g.lx + (e.clientX - g.lx) * s / steps, clientY: g.ly + (e.clientY - g.ly) * s / steps });
        if (ci >= 0) applyTool(ci, g);
      }
      g.lx = e.clientX; g.ly = e.clientY;
    }
  } else if (!gesture && !newDrag && e.pointerType === 'mouse' && e.target === canvas){
    if (tool !== 'move') showHover(pickCell(e), false);
    else canvas.style.cursor = pickItem(e) ? 'grab' : '';
  }
});
function endGesture(e, cancelled){
  const g = gesture;
  if (!g || e.pointerId !== g.pointerId) return;
  gesture = null;
  controls.enabled = true;
  if (g.kind === 'look'){
    if (!cancelled && tool === 'move' && Math.hypot(e.clientX - g.sx, e.clientY - g.sy) < 6) select(null);
  } else if (g.kind === 'move'){
    const it = g.it;
    it.lift = false; dragRing.visible = false;
    if (g.moved){
      if (!cancelled && overTray(e)){ pushUndo(g.before); removeItem(it); audio.play('remove'); flash('Removed. Press Undo to bring it back.'); save(); }
      else if (cancelled || !g.valid){ it.x = g.x0; it.z = g.z0; setGround(it, g.gr0); if (!cancelled){ audio.play('nope'); flash("It can't go there. Try an empty spot.", true); } }
      else {
        if (it.x !== g.x0 || it.z !== g.z0){ pushUndo(g.before); save(); }
        it.anim = { kind: 'drop', t: 0 }; audio.play('drop');
        if (g.gr0 && !it.gr) flash('On the tiles it stands in a pot.');
        updateSelbar();
      }
    }
    tray.classList.remove('remove');
  } else if (g.kind === 'stroke'){

    if (g.changed){ pushUndo(g.before); save(); }
  }
}
window.addEventListener('pointerup', e => endGesture(e, false));
window.addEventListener('pointercancel', e => endGesture(e, true));

function showRing(it, valid){
  dragRing.material.color.set(valid ? 0x4caf50 : 0xe5534b);
  dragRing.position.set(it.x, surfaceY(it.x, it.z) + .012, it.z);
  dragRing.scale.setScalar(it.r);
  dragRing.visible = true;
}

/* ---- dragging new things out of the tray ---- */
function bindCard(card, type){
  card.addEventListener('pointerdown', e => {
    if (e.button > 0 || newDrag || gesture) return;
    newDrag = { type, pointerId: e.pointerId, sx: e.clientX, sy: e.clientY, started: false, mouse: e.pointerType === 'mouse' };
    try { card.setPointerCapture(e.pointerId); } catch (_) {}
  });
  card.addEventListener('pointermove', e => {
    const d = newDrag; if (!d || e.pointerId !== d.pointerId) return;
    if (!d.started){
      const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
      const go = d.mouse ? Math.hypot(dx, dy) > 6 : (dy < -10 && Math.abs(dy) > Math.abs(dx));
      if (!go) return;
      startNewDrag(d);
    }
    moveNewDrag(d, e);
  });
  card.addEventListener('pointerup', e => {
    const d = newDrag; if (!d || e.pointerId !== d.pointerId) return;
    newDrag = null;
    if (d.started) finishNewDrag(d, e); else tapPlace(type);
  });
  card.addEventListener('pointercancel', e => {
    const d = newDrag; if (!d || e.pointerId !== d.pointerId) return;
    newDrag = null;
    if (d.started) cancelNewDrag(d);
  });
}
function startNewDrag(d){
  d.started = true; d.before = serialize();
  controls.enabled = false; select(null); hover.visible = false;
  d.ghost = addItem(d.type, 0, 0, 0, false);
  d.ghost.ghost = true; d.ghost.lift = true; d.ghost.g.visible = false;
  chip.src = THUMB[d.type];
  audio.play('pick');
}
function moveNewDrag(d, e){
  const fp = overTray(e) ? null : floorPoint(e);
  const gh = d.ghost;
  if (!fp){ gh.g.visible = false; dragRing.visible = false; chip.style.display = 'block'; chip.style.left = e.clientX + 'px'; chip.style.top = e.clientY + 'px'; return; }
  chip.style.display = 'none';
  gh.x = snap(fp.x); gh.z = snap(fp.z);
  setGround(gh, onSoil(gh.x, gh.z));   // a new plant goes straight in the soil, on the tiles it keeps its pot
  if (!gh.g.visible){ gh.g.position.set(gh.x, surfaceY(gh.x, gh.z) + .15, gh.z); gh.g.visible = true; }
  d.valid = canPlace(gh.x, gh.z, gh.r, gh);
  showRing(gh, d.valid);
}
function finishNewDrag(d, e){
  const gh = d.ghost;
  chip.style.display = 'none'; dragRing.visible = false; controls.enabled = true;
  if (gh.g.visible && d.valid){
    gh.ghost = false; gh.lift = false; gh.anim = { kind: 'drop', t: 0 };
    pushUndo(d.before); select(gh); save(); audio.play('place');
    if (!finishNewDrag.done){ finishNewDrag.done = true; flash('Nice! Drag it to move it. The buttons above it turn, resize or remove it.'); }
  } else {
    removeItem(gh);
    if (gh.g.visible){ audio.play('nope'); flash("It can't go there. Try an empty spot.", true); }
  }
}
function cancelNewDrag(d){ chip.style.display = 'none'; dragRing.visible = false; controls.enabled = true; removeItem(d.ghost); }
function tapPlace(type){
  const r = BY_ID[type].r * defScale(type), cx = X0 + (SOIL_C[0] + SOIL_C[1] + 1) / 2 * CELL;   // start from the middle of the soil bed
  for (let ring = 0; ring < 14; ring++){
    for (let a = 0; a < Math.max(1, ring * 6); a++){
      const ang = a / Math.max(1, ring * 6) * Math.PI * 2;
      const x = snap(cx + Math.cos(ang) * ring * .3), z = snap(.3 + Math.sin(ang) * ring * .3);
      if (isSoil(...cellAt(x, z)) && canPlace(x, z, r, null)){
        const before = serialize();
        const it = addItem(type, x, z, 0, true, { gr: true });
        pushUndo(before); select(it); save(); audio.play('place');
        flash('Added. Drag it to where you like.');
        return;
      }
    }
  }
  flash('No empty spot left. Move or remove something first.', true);
}

/* ---- buttons, keys, reset ---- */
function turnSelected(){ if (!selected) return; pushUndo(); selected.rot -= Math.PI / 4; save(); audio.play('turn'); }
function removeSelected(){ if (!selected) return; pushUndo(); removeItem(selected); save(); audio.play('remove'); flash('Removed. Press Undo to bring it back.'); }
function sizeSelected(dir){
  const it = selected; if (!it) return;
  const s = SIZES[clamp(sizeIndex(it.s) + dir, 0, SIZES.length - 1)];
  if (s === it.s) return;
  pushUndo(); setSize(it, s); save(); updateSelbar();
  audio.play(dir > 0 ? 'grow' : 'shrink');
}
function togglePot(){
  const it = selected; if (!it || !it.plant) return;
  if (!it.gr && !onSoil(it.x, it.z)){ audio.play('nope'); flash('Only on the soil. Move it onto the soil first.', true); return; }
  pushUndo(); setGround(it, !it.gr); it.anim = { kind: 'drop', t: 0 }; save(); updateSelbar();
  audio.play(it.gr ? 'plant' : 'pot'); flash(it.gr ? 'Planted straight in the soil.' : 'Now in a pot.');
}

/* ---- save a picture of the view ---- */
function savePicture(){
  closePops();
  const W = innerWidth, H = innerHeight;
  const marks = [selRing, dragRing, hover].map(m => [m, m.visible]);
  marks.forEach(([m]) => { m.visible = false; });
  controls.update();
  camera.clearViewOffset(); camera.updateProjectionMatrix();          // centre the garden for the picture
  renderer.render(scene, camera);
  const out = document.createElement('canvas'); out.width = canvas.width; out.height = canvas.height;
  const cx = out.getContext('2d'), k = out.width / W;
  const sky = cx.createLinearGradient(0, 0, 0, out.height);
  sky.addColorStop(0, '#b9d9f0'); sky.addColorStop(.52, '#e2eee8'); sky.addColorStop(1, '#eee9de');
  cx.fillStyle = sky; cx.fillRect(0, 0, out.width, out.height);
  cx.drawImage(canvas, 0, 0);
  camera.setViewOffset(W, H, 0, Math.round(trayH * .45), W, H); camera.updateProjectionMatrix();
  marks.forEach(([m, v]) => { m.visible = v; });
  const date = new Date(), label = 'Garden plan · ' + date.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  cx.font = `600 ${Math.round(15 * k)}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
  cx.fillStyle = 'rgba(45,58,46,.75)'; cx.fillText(label, 20 * k, out.height - 20 * k);
  // turn it into a file right away (same tap), so the iPad share sheet is allowed to open
  const bin = atob(out.toDataURL('image/png').split(',')[1]), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const name = `garden-plan-${date.toISOString().slice(0, 10)}.png`, blob = new Blob([bytes], { type: 'image/png' });
  audio.play('shutter');
  const file = typeof File === 'function' ? new File([blob], name, { type: 'image/png' }) : null;
  if (file && navigator.maxTouchPoints > 0 && navigator.canShare && navigator.canShare({ files: [file] })){
    navigator.share({ files: [file], title: 'My garden plan' }).catch(() => {});
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    flash('Picture saved to your Downloads.');
  }
}

/* ---- share link: the whole design lives in the link itself (no database) ---- */
// Keep CATALOG order stable: new items go at the end, or old links will open the wrong plants.
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
// Version 2 links: 5 letters per item (type, x, z, turn + 8 if in the soil, size) and one digit per soil square.
// Version 1 links (phase 1: 4 letters per item, 135 squares in the old wider bed) still open.
function encodeDesign(){
  let it = '';
  for (const i of items){
    if (i.ghost) continue;
    const t = CATALOG.indexOf(BY_ID[i.type]);
    const xi = clamp(Math.round(i.x / SNAP) + 11, 0, 63), zi = clamp(Math.round(i.z / SNAP) + 22, 0, 63);
    const ri = ((Math.round(-i.rot / (Math.PI / 4)) % 8) + 8) % 8;
    it += B64[t] + B64[xi] + B64[zi] + B64[ri + (i.gr ? 8 : 0)] + B64[sizeIndex(i.s)];
  }
  // each soil square: 0 plain, 1-2 dug, 3-4 water, 5 grass, 6 sand; long runs of plain soil are shortened to "z" + count
  const raw = cells.map(c => c.g ? 5 : c.sa ? 6 : c.wa ? 2 + c.d : c.d).join('');
  const cs = raw.replace(/0{3,}/g, m => { let s = ''; for (let n = m.length; n > 0; n -= 63) s += 'z' + B64[Math.min(63, n)]; return s; });
  return '2.' + it + '.' + cs;
}
function decodeDesign(code){
  const [v, it, cs] = code.split('.');
  const per = v === '2' ? 5 : v === '1' ? 4 : 0;
  if (!per || it === undefined || cs === undefined || it.length % per) return null;
  const out = { v: +v, items: [], cells: [] };
  for (let k = 0; k < it.length; k += per){
    const [t, xi, zi, ri, si = 0] = [...it.slice(k, k + per)].map(ch => B64.indexOf(ch));
    if (Math.min(t, xi, zi, ri, si) < 0 || !CATALOG[t]) continue;
    const item = [CATALOG[t].id, +((xi - 11) * SNAP).toFixed(2), +((zi - 22) * SNAP).toFixed(2), -(ri % 8) * Math.PI / 4];
    if (per === 5) item.push(ri >= 8 ? 1 : 0, SIZES[Math.min(si, SIZES.length - 1)]);
    out.items.push(item);
  }
  let raw = '';
  for (let k = 0; k < cs.length; k++){ if (cs[k] === 'z') raw += '0'.repeat(Math.max(0, B64.indexOf(cs[++k]))); else raw += cs[k]; }
  if (v === '1'){
    if (raw.length !== OLD_COUNT || /[^0-5]/.test(raw)) return null;
    out.cells = [...raw].map(ch => { const d = +ch; return d === 5 ? [0, 1, 0, 0] : d >= 3 ? [d - 2, 0, 0, 1] : [d, 0, 0, 0]; });   // phase 1 squares: [dug, grass, wet, water]
    return JSON.stringify(upgrade(out));
  }
  if (raw.length !== cells.length || /[^0-6]/.test(raw)) return null;
  out.cells = [...raw].map(ch => { const d = +ch; return d === 5 ? [0, 1, 0, 0] : d === 6 ? [0, 0, 0, 1] : d >= 3 ? [d - 2, 0, 1, 0] : [d, 0, 0, 0]; });   // [dug, grass, water, sand]
  return JSON.stringify(out);
}
async function shareLink(){
  closePops();
  const url = location.href.split('#')[0] + '#g=' + encodeDesign();
  audio.play('tick');
  if (navigator.share && navigator.maxTouchPoints > 0){
    try { await navigator.share({ title: 'My garden plan', url }); } catch (e) {}
    return;
  }
  try { await navigator.clipboard.writeText(url); flash('Link copied. Paste it into WhatsApp or an email.'); }
  catch (e) { window.prompt('Copy this link:', url); }
}
$('picBtn').onclick = savePicture;
$('linkBtn').onclick = shareLink;
$('turnBtn').onclick = turnSelected;
$('delBtn').onclick = removeSelected;
bigBtn.onclick = () => sizeSelected(1);
smallBtn.onclick = () => sizeSelected(-1);
potBtn.onclick = togglePot;
undoBtn.onclick = undo;
resetBtn.onclick = () => { $('modal').hidden = false; };
$('modal').addEventListener('click', e => {
  const k = e.target.dataset.reset; if (!k && e.target !== $('modal')) return;
  $('modal').hidden = true;
  if (k === 'now' || k === 'empty'){ pushUndo(); loadDefault(k === 'empty'); save(); audio.play('remove'); flash(k === 'empty' ? 'Empty garden. Have fun!' : 'Back to your garden as it is now.'); }
});
window.addEventListener('keydown', e => {
  if (!$('modal').hidden) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') removeSelected();
  else if (e.key.toLowerCase() === 'r') turnSelected();
  else if (e.key === '+' || e.key === '=') sizeSelected(1);
  else if (e.key === '-' || e.key === '_') sizeSelected(-1);
  else if (e.key === 'Escape') select(null);
});
document.addEventListener('gesturestart', e => e.preventDefault());

/* ================= frame loop ================= */
let trayH = 150;
function resize(){
  const W = innerWidth, H = innerHeight;
  trayH = tray.offsetHeight + 12; selW = 0;
  document.documentElement.style.setProperty('--trayH', trayH + 'px');
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.setViewOffset(W, H, 0, Math.round(trayH * .45), W, H);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const _v = new THREE.Vector3();
function positionSelbar(){
  if (!selected || (gesture && gesture.kind === 'move' && gesture.moved)){ selbar.style.display = 'none'; return; }
  const p = selected.g.position;
  selRing.position.set(p.x, surfaceY(selected.x, selected.z) + .01, p.z); selRing.scale.setScalar(selected.r);
  _v.set(p.x, p.y + selected.h + .1, p.z).project(camera);
  selbar.style.display = 'flex';
  if (!selW) selW = selbar.offsetWidth;
  const hw = Math.min(selW / 2 + 8, innerWidth / 2);   // keep the whole bar on screen
  const x = clamp((_v.x + 1) / 2 * innerWidth, hw, innerWidth - hw), y = clamp((1 - _v.y) / 2 * innerHeight, 70, innerHeight - trayH - 20);
  selbar.style.left = x + 'px'; selbar.style.top = y + 'px';
}
function updateItems(dt){
  const k = Math.min(1, dt * 16);
  for (const it of items){
    const g = it.g;
    if (!g.visible) continue;
    g.position.x += (it.x - g.position.x) * k;
    g.position.z += (it.z - g.position.z) * k;
    const ty = surfaceY(it.x, it.z) + (it.lift ? .15 : 0);
    g.position.y += (ty - g.position.y) * k;
    g.rotation.y += (it.rot - g.rotation.y) * Math.min(1, dt * 12);
    const ms = it.mesh.scale.x;   // Bigger / Smaller grow smoothly
    if (ms !== it.s) it.mesh.scale.setScalar(Math.abs(it.s - ms) < .003 ? it.s : ms + (it.s - ms) * Math.min(1, dt * 10));
    let sy = 1, sxz = 1, wob = 0;
    if (it.anim){
      const t = (it.anim.t += dt), e = Math.exp(-t * 6);
      if (it.anim.kind === 'drop'){ sy = 1 - .14 * Math.sin(t * 16) * e; sxz = 1 + .07 * Math.sin(t * 16) * e; }
      else wob = .07 * Math.sin(t * 22) * Math.exp(-t * 4);
      if (t > 1.2) it.anim = null;
    }
    g.scale.set(sxz, sy, sxz); g.rotation.z = wob;
  }
}
function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.v.y -= 6 * dt; p.m.position.addScaledVector(p.v, dt); p.life -= dt;
    if (p.life <= 0 || p.m.position.y < p.floor){ scene.remove(p.m); particles.splice(i, 1); }
  }
}
function updateWalls(dt){
  for (const w of walls){
    const target = w.out() ? .12 : 1;
    w.mat.opacity += (target - w.mat.opacity) * Math.min(1, dt * 8);
    w.mat.depthWrite = w.mat.opacity > .9;
  }
}
let last = performance.now(), time = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  if (camTween){
    camTween.k = Math.min(1, camTween.k + dt * 1.6);
    const t = camTween.k, e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (t >= 1) camTween = null;
  }
  controls.update();
  controls.target.set(clamp(controls.target.x, -3, 3), clamp(controls.target.y, 0, 1.5), clamp(controls.target.z, -4.5, 4.5));
  updateItems(dt); updateParticles(dt); updateWalls(dt);
  waterMat.opacity = .8 + Math.sin(time * 2) * .04;
  positionSelbar(); updateViewBtn();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ================= start ================= */
makeThumbs();
buildTray();
let loaded = false;
// a phase 1 save (old key) opens too, converted to the new bed
try { const s = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY); if (s){ restore(s); loaded = true; } } catch (e) {}
if (!loaded) loadDefault(false);
// Opened from a share link? Load that design (the visitor's own design stays one Undo away).
let openedShared = false;
if (location.hash.startsWith('#g=')){
  let shared = null;
  try { shared = decodeDesign(decodeURIComponent(location.hash.slice(3))); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
  if (shared){ pushUndo(); restore(shared); save(); openedShared = true; }
}
resize();
const start = viewPose('3d'); camera.position.copy(start.p); controls.target.copy(start.t); controls.update();
if (openedShared){ setHint('You opened a shared garden design. Press Undo to go back to your own.'); }
else { setHint('Drag empty space to turn the view. Pinch or scroll to zoom.'); hintTimer = setTimeout(() => setHint(TOOL_HINT.move), 4500); }
$('loading').remove();
requestAnimationFrame(frame);

// Lets Chrome (Android tablets, laptops) install the planner as a real app with its icon.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Browsers only allow sound after the first tap or key press.
window.addEventListener('pointerdown', () => audio.init(), true);
window.addEventListener('keydown', () => audio.init(), true);

// Sound test panel for the studio: open the page with ?sounds at the end of the address.
if (new URLSearchParams(location.search).has('sounds')){
  const LABEL = { tick: 'Button tap', pick: 'Pick up', drop: 'Put down', place: 'New plant', nope: "Can't go there", remove: 'Remove',
    dig: 'Dig', water: 'Water', splash: 'Scoop water', grass: 'Grass', rake: 'Rake', sand: 'Sand', grow: 'Bigger', shrink: 'Smaller',
    pot: 'Into pot', plant: 'Into soil', turn: 'Turn', undo: 'Undo', shutter: 'Save picture' };
  const p = document.createElement('div');
  p.className = 'panel sound-test';
  p.innerHTML = '<b>Sound test</b><p>Tap to listen. Background music is in the Sound menu at the top.</p>' +
    audio.names.map(n => `<button class="pbtn" data-snd="${n}">${LABEL[n] || n}</button>`).join('');
  p.addEventListener('click', e => { const b = e.target.closest('[data-snd]'); if (b){ audio.init(); audio.test(b.dataset.snd); } });
  document.body.appendChild(p);
}

// for checking in tests
window.__garden = { items, cells, setTool, serialize, restore, addItem, camera, controls, encodeDesign, decodeDesign, audio,
  select, get selected(){ return selected; }, sizeSelected, togglePot, setGround, tapPlace, loadDefault, applyTool, onSoil, cellAt, soilCellAt,
  SIZES, KEY, OLD_KEY, undo, updateItems, refreshCells, renderer, scene };
</script>
